<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sign in — Affiliate Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a0f;--panel:#101724;--line:#29364b;--text:#eaf0f7;--muted:#93a0b2;--mint:#5ff0c0;--blue:#76b0ff;--red:#ff9ba5}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;color:var(--text);font:14px/1.5 "Spline Sans",system-ui,sans-serif;background:radial-gradient(780px 440px at 50% 3%,rgba(95,240,192,.12),transparent 70%),radial-gradient(650px 500px at 10% 90%,rgba(118,176,255,.08),transparent 70%),var(--bg)}
main{width:min(100%,420px)}
.brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:28px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(95deg,var(--mint),var(--blue));position:relative;box-shadow:0 0 24px rgba(95,240,192,.3)}
.logo::after{content:"";position:absolute;inset:7px;border-radius:4px;border:2px solid rgba(7,10,15,.85);border-right-color:transparent;transform:rotate(-20deg)}
.brand b{font:800 18px "Bricolage Grotesque",sans-serif}
.card{padding:32px;background:linear-gradient(180deg,#141d2b,var(--panel));border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.32)}
h1{font:800 28px/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin:0 0 8px}
.intro{margin:0 0 26px;color:var(--muted)}
label{display:block;font-weight:600;font-size:12px;margin:0 0 7px}
.field{margin-bottom:17px}
input{width:100%;height:46px;padding:10px 13px;border:1px solid #35445d;border-radius:11px;color:var(--text);background:#0b111c;font:inherit;outline:none}
input:focus-visible{border-color:var(--mint);box-shadow:0 0 0 3px rgba(95,240,192,.14)}
input::placeholder{color:#68778c}
.error{padding:10px 12px;margin:0 0 18px;border:1px solid #874452;border-radius:10px;background:rgba(255,111,125,.1);color:var(--red);font-size:12.5px}
.error[hidden]{display:none}
button{width:100%;height:46px;margin-top:7px;border:0;border-radius:11px;color:#06140f;background:linear-gradient(95deg,var(--mint),var(--blue));font:700 14px "Spline Sans",sans-serif;cursor:pointer}
button:hover{filter:brightness(1.07)}
button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
@media(max-width:480px){body{padding:16px}.card{padding:26px 22px}}
</style>
</head>
<body>
<main>
  <div class="brand"><div class="logo" aria-hidden="true"></div><b>Affiliate Analytics</b></div>
  <section class="card" aria-labelledby="title">
    <h1 id="title">Welcome back</h1>
    <p class="intro">Sign in to see your affiliate clicks, bookings and earnings.</p>
    <p class="error" id="loginError" role="alert" hidden>That username or password didn’t work. Please try again.</p>
    <form method="post" action="/login" autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Sign in</button>
    </form>
  </section>
  <p class="foot">Your analytics are available after sign in.</p>
</main>
<script>
if(new URLSearchParams(location.search).get('error')==='1') document.getElementById('loginError').hidden=false;
</script>
</body>
</html>
